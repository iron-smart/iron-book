  /* צבע — מותג אחד, מצב "פנוי/הצלחה" אחד, שגיאה אחת */

  --brand-deep:#061827; --brand-deep-2:#0B3552; --brand-soft:#173A57;   /* v2.5 — כותרת הנייד ופס הסיכום, כמו topnav במערכת */
  --ink:#0E1A26; --ink-2:#3A4754; --ink-3:#5E6B78; --ink-4:#8A95A1;

  --line:#E3E7EC; --line-2:#CFD6DE;
  --ok:#1F7A55; --ok-bg:#E8F5EE; --ok-line:#BFE3CF;
  --warn:#8A5A00; --warn-bg:#FFF6E3; --warn-line:#F2DDA8;

  --r-sm:8px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(14,26,38,.04), 0 1px 1px rgba(14,26,38,.03);
  --sh-2:0 12px 32px -12px rgba(14,26,38,.18), 0 2px 6px rgba(14,26,38,.04);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:150ms;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Heebo,system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);font-size:var(--t-md);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-underline-offset:3px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══ Shell ═══════════════════════════════════════════════════════════════ */
.top{max-width:1040px;margin:0 auto;padding:var(--s5) var(--s6) 0;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.top .logo{display:block;height:50px;width:auto}
.top nav{display:flex;align-items:center;gap:var(--s5);font-size:var(--t-sm)}
.top nav a{text-decoration:none;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.top nav a:hover{color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:var(--s6)}
.card{display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;min-height:560px}
.main::after{content:"";position:absolute;left:6%;right:6%;top:9%;bottom:14%;background:var(--brand);-webkit-mask:var(--emb) center top/contain no-repeat;mask:var(--emb) center top/contain no-repeat;opacity:.02;pointer-events:none;z-index:2;animation:wm .6s var(--ease) both}
@keyframes wm{from{opacity:0}to{opacity:.02}}
.foot{max-width:1040px;margin:0 auto;padding:0 var(--s6) var(--s10);font-size:var(--t-xs);color:var(--ink-4);display:flex;gap:var(--s3);flex-wrap:wrap}
.foot a{color:var(--ink-3)}

/* ═══ Summary (aside) ═════════════════════════════════════════════════════ */
.sum{position:relative;background:var(--brand);color:#fff;padding:var(--s8) var(--s6);display:flex;flex-direction:column;gap:var(--s6);overflow:hidden}
.sum>*{position:relative;z-index:1}
.sum::after{content:"";position:absolute;inset-inline-start:-18%;bottom:-6%;width:92%;aspect-ratio:327/207;background:#fff;-webkit-mask:var(--emb) center/contain no-repeat;mask:var(--emb) center/contain no-repeat;opacity:.07;pointer-events:none;z-index:0}
.sum .eyebrow{font-size:var(--t-xs);font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.04em}
.sum h1{margin:var(--s2) 0 0;font-size:var(--t-2xl);line-height:1.2;font-weight:700;letter-spacing:-.015em;color:#fff}
.sum .lead{margin:var(--s3) 0 0;color:rgba(255,255,255,.86);font-size:var(--t-sm);line-height:1.6}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.facts li{display:flex;gap:var(--s3);align-items:flex-start;font-size:var(--t-sm);color:rgba(255,255,255,.88)}
.facts li svg{flex:none;margin-top:2px;color:rgba(255,255,255,.66)}
.facts li b{color:#fff;font-weight:600}
.facts li.pick b{color:#fff}
.facts .chg{font-size:var(--t-xs);color:rgba(255,255,255,.78);margin-inline-start:var(--s2);text-decoration:underline}
.facts .chg:hover{color:#fff}
.assure{margin-top:auto;padding-top:var(--s5);border-top:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:var(--s2);font-size:var(--t-sm);color:rgba(255,255,255,.88)}
.assure span{display:flex;gap:var(--s2);align-items:center}
.assure svg{color:#86D7AE;flex:none}
/* מובייל: שורת סיכום אחת */
#sbar{display:none}

/* ═══ Main panel ══════════════════════════════════════════════════════════ */
.main{position:relative;padding:var(--s8);display:flex;flex-direction:column;min-width:0}
.phead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s6)}
.back{width:36px;height:36px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--line);transition:background var(--dur) var(--ease),border-color var(--dur)}
.back:hover{background:var(--hover);border-color:var(--line-2)}
.phead .ttl{flex:1;min-width:0}
.phead h2{margin:0;font-size:var(--t-lg);font-weight:700;line-height:1.3}
.phead .stp{font-size:var(--t-xs);color:var(--ink-3);font-weight:500}
.prog{display:flex;gap:6px}
.prog i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--brand)}
.view{animation:in .18s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Option cards (סוג פגישה) ── */
.opts{display:grid;gap:var(--s3)}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s4);align-items:center;text-align:start;width:100%;padding:var(--s5);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);transition:border-color var(--dur) var(--ease),background var(--dur),box-shadow var(--dur)}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.opt .ic{width:44px;height:44px;border-radius:var(--r-md);background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.opt .t{font-weight:600;font-size:var(--t-md)}
.opt .d{color:var(--ink-3);font-size:var(--t-sm);margin-top:2px}
.opt .m{font-size:var(--t-xs);color:var(--ink-2);background:var(--hover);border-radius:var(--r-pill);padding:4px 10px;white-space:nowrap;font-weight:500}
.opt .go{color:var(--ink-4);transition:transform var(--dur) var(--ease),color var(--dur)}
.opt:hover .go{color:var(--ink);transform:translateX(-2px)}
.optfoot{margin-top:var(--s5);font-size:var(--t-sm);color:var(--ink-3)}
.psub{margin:calc(-1 * var(--s4)) 0 var(--s5);color:var(--ink-2);font-size:var(--t-sm)}
.proof{margin-top:var(--s3);font-size:var(--t-sm);color:var(--ink-2);font-weight:600}
/* v2.6 — שאלת "במה אתם מתעניינים" */
.qbox{margin-bottom:var(--s5);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2)}
.qbox.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(180,35,24,.08)}
.qbox .ql{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink);margin-bottom:var(--s3)}
.qbox .chips{gap:var(--s2)}
.qbox .chip{height:40px;background:var(--surface)}
.qbox .chip[aria-checked="true"]{background:var(--brand);color:var(--brand-ink)}
.qbox .f{margin-top:var(--s4)}
.qbox .e{display:block;margin-top:var(--s2);font-size:var(--t-xs);color:var(--err)}
/* v2.5 — מיקום האולם */
.opt .loc2{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:var(--t-xs);color:var(--ink-2);font-weight:500}
.opt .loc2 svg{color:var(--brand);flex:none}
.where{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--t-sm);color:var(--ink-2)}
.where svg{color:var(--brand);flex:none}
.where b{color:var(--ink);font-weight:600}
.where a{margin-inline-start:auto;font-weight:600;font-size:var(--t-xs)}
.facts a.chg{display:inline-block}

/* ── Day strip ── */
.lbl{font-size:var(--t-sm);font-weight:600;color:var(--ink-2);margin:0 0 var(--s3);display:flex;justify-content:space-between;align-items:baseline}
.lbl small{font-weight:400;color:var(--ink-4);font-size:var(--t-xs)}
.days{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px var(--s2);margin:0 -2px;scrollbar-width:thin;scroll-snap-type:x proximity}
.day{flex:none;width:76px;padding:var(--s3) 0 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:start;transition:border-color var(--dur) var(--ease),background var(--dur)}
.day:hover{border-color:var(--line-2);background:var(--surface-2)}
.day .dw{font-size:var(--t-xs);color:var(--ink-3)}
.day .dn{font-size:var(--t-xl);font-weight:700;line-height:1.1}
.day .dm{font-size:11px;color:var(--ink-4)}
.day[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.day[aria-checked="true"] .dw,.day[aria-checked="true"] .dm{color:rgba(255,255,255,.78)}
/* ── Time grid ── */
.grp{margin-top:var(--s6)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}

      '<div class="next" style="grid-template-columns:1fr"><div><b>' + h(T('questions')) + '</b><span>' + h(T('manage.call')) + ' ' + phoneA() + '</span></div></div></div>';
  }

  /* ═══════════════ ציור ═══════════════ */
  function render(focus) {
    var html;
    if (S.mode === 'manage') html = vManage();
    else if (S.cfg && S.cfg.enabled === false && !PV) html = stateBox(IC.cal, T('empty.disabled.title'), h(T('empty.disabled.text')), callBtn() + homeBtn());
    else if (!S.cfg) html = S.degraded ? stateBox(IC.alert, T('degraded.title'), h(T('degraded.text')), callBtn() + homeBtn()) : '<div class="sk" style="height:28px;width:40%"></div><div class="sk" style="height:88px;margin-top:24px"></div><div class="sk" style="height:88px;margin-top:12px"></div>';
    else if (S.done) html = vDone();
    else if (S.step === 1) html = vType();
    else if (S.step === 2) html = vWhen();
    else html = vDetails();
    $('main').innerHTML = '<div class="view" style="display:flex;flex-direction:column;flex:1;min-height:0">' + html + '</div>';
    $('sbar').innerHTML = sumbarHtml();   /* במובייל בלבד (CSS) — שורת סיכום אחת מעל השלב */
    $('sum').innerHTML = sumHtml();
    $('ftA').textContent = T('foot.brand') + ' · ' + addr();
    applyStatic();
    if (focus) { var f = $(focus); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } } }
  }
  function toTop() { var y = $('card').getBoundingClientRect().top + window.pageYOffset - 8; if (window.pageYOffset > y) window.scrollTo({ top: y, behavior: 'smooth' }); }

  /* ═══════════════ נתונים ═══════════════ */
  function loadSlots() {
    S.days = null; S.degraded = false; render();
    api({ action: 'slots', type: S.type }).then(function (j) {
      if (j.enabled === false) { S.cfg.enabled = false; render(); return; }
      if (!j.ok || j.degraded) { S.degraded = true; track('booking_error', { booking_type: S.type, reason: j.degraded ? 'degraded' : 'slots_' + j._status }); render(); return; }
      S.days = j.days || []; render();
    });
  }
  function readForm() {
    var fm = $('frm'); if (!fm) return;
    S.f.name = fm.name.value.trim(); S.f.phone = fm.phone.value.trim(); S.f.email = fm.email.value.trim();
    S.f.city = fm.city.value.trim(); if (fm.notes) S.f.notes = fm.notes.value.trim(); S.f.consent = fm.consent.checked; S.f.website = fm.website.value;
    var mo = $('more'); if (mo) S.moreOpen = mo.open;
  }
  function phoneOk(p) { var d = String(p).replace(/[^0-9]/g, ''); if (d.indexOf('972') === 0) d = '0' + d.slice(3); return /^05[0-9]{8}$/.test(d) || /^0[2-9][0-9]{7}$/.test(d) || /^07[0-9]{8}$/.test(d); }
  function validate() {
    var e = {};
    if (!S.intent) e.intent = T('err.intent');
    else if (S.f.notes.length < 2) e.notes = T(S.intent === 'product' ? 'err.notes.product' : 'err.notes.more');
    if (S.f.name.length < 2) e.name = T('err.name');
    if (!phoneOk(S.f.phone)) e.phone = T('err.phone');
    if (!S.f.email) e.email = T('err.email.req');
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.f.email)) e.email = T('err.email');
    if (!S.f.consent) e.consent = T('err.consent.long');
    return e;
  }
  function submit() {
    readForm(); S.errs = validate(); S.msg = null;
    if (Object.keys(S.errs).length) {
      render(S.errs.intent ? 'qi0' : S.errs.notes ? 'f_notes' : S.errs.name ? 'f_name' : S.errs.phone ? 'f_phone' : S.errs.email ? 'f_email' : 'f_consent'); return;
    }
    if (PV) { pvDone(); return; }
    S.busy = true; render();
    track('booking_submit', { booking_type: S.type });
    var body = { action: 'book', type: S.type, date: S.day, time: S.slot, full_name: S.f.name, phone: S.f.phone,
      email: S.f.email || undefined, city: S.f.city || undefined, notes: S.f.notes || undefined, intent: S.intent || undefined,
      consent: S.f.consent === true, website: S.f.website || undefined, page: (srcPage || location.href).slice(0, 500) };
    UTM_KEYS.forEach(function (k) { if (utm[k]) body[k] = utm[k]; });
    api({ action: 'book' }, body).then(function (j) {
      S.busy = false;
      if (j.ok && j.booked) {
        S.done = { type: S.type, date: j.date || S.day, time: j.time || S.slot, end: j.end || addMin(j.time || S.slot, dur(S.type)), address: j.address || addr(), token: j.manage_token || '' };
        track('booking_complete', { booking_type: S.type, booking_date: S.done.date, booking_time: S.done.time });
        render('ph'); toTop(); return;
      }
      var err = j.error;
      track('booking_error', { booking_type: S.type, reason: String(err || j._status) });
      if (err === 'invalid' && j.fields) {
        var map = { full_name: 'name', phone: 'phone', email: 'email', consent: 'consent', intent: 'intent', notes: 'notes' };
        j.fields.forEach(function (f) { if (map[f]) S.errs[map[f]] = T('err.field'); });
        if (j.fields.indexOf('slot') >= 0) { S.step = 2; S.slot = null; S.msg = { k: 'err', html: h(T('err.slot')) }; loadSlots(); return; }
        S.msg = { k: 'err', html: h(T('err.fields')) }; render(); return;
      }
      if (err === 'taken') {
        S.step = 2; S.slot = null; if (j.days) S.days = j.days;
        S.msg = { k: 'warn', html: h(T('err.taken')) };
        if (!j.days) loadSlots(); else render('ph'); toTop(); return;
      }
      if (err === 'exists') {
        var ex = j.existing || {};
        S.msg = { k: 'warn', html: h(T('err.exists', { date: ex.date ? ' ל' + dLong(ex.date) + ' בשעה ' + ex.time : '' })) + ' ' + phoneA() + '.' };
        render(); toTop(); return;
      }
      if (err === 'rate_limited') { S.msg = { k: 'err', html: withPhone('err.rate') }; render(); return; }
      S.msg = { k: 'err', html: withPhone('err.book') }; render(); toTop();
    });
  }
  function loadManage() {
    api({ action: 'manage', m: token }).then(function (j) {
      if (j._status === 404) S.mg = { notFound: true };
      else if (!j.ok || !j.booking) S.mg = { error: true };
      else S.mg = { booking: j.booking, days: j.days || [], degraded: !!j.degraded };
      if (S.mg.booking) track('booking_manage_view', { booking_type: S.mg.booking.type, booking_status: S.mg.booking.status });
      render();
    });
  }
  function doCancel() {
    if (PV) { closeDlg(); S.mg.booking.status = 'cancelled'; S.msg = { k: 'ok', html: h(T('cancel.ok')) }; render('ph'); return; }
    S.busy = true; S.msg = null;
    api({ action: 'cancel' }, { action: 'cancel', m: token }).then(function (j) {
      S.busy = false; closeDlg();
      if (j.ok || j.result === 'already') {
        S.mg.booking = Object.assign({}, S.mg.booking, j.booking || {}, { status: 'cancelled' });
        S.msg = { k: 'ok', html: h(T('cancel.ok')) };
        track('booking_cancel', { booking_type: S.mg.booking.type });
      } else if (j.result === 'past') S.mg.booking.status = 'past';
      else S.msg = { k: 'err', html: withPhone('err.cancel') };
      render('ph');
    });
  }
  function doMove() {
    if (!S.slot) return;
    if (PV) { S.mg.booking = Object.assign({}, S.mg.booking, { date: S.day, time: S.slot }); S.mgView = 'info'; S.day = null; S.slot = null; S.msg = { k: 'ok', html: h(T('move.ok')) }; render('ph'); return; }
    S.busy = true; S.msg = null; render();
    var old = S.mg.booking;
    api({ action: 'reschedule' }, { action: 'reschedule', m: token, date: S.day, time: S.slot }).then(function (j) {
      S.busy = false;
      if (j.ok) {
        S.mg.booking = Object.assign({}, old, j.booking || {}); S.mgView = 'info'; S.day = null; S.slot = null;
        S.msg = { k: 'ok', html: h(T('move.ok')) };
        track('booking_reschedule', { booking_type: old.type, booking_date: S.mg.booking.date, booking_time: S.mg.booking.time });
        render('ph'); toTop(); loadManage(); return;
      }
      if (j.error === 'taken') { S.slot = null; if (j.days) S.mg.days = j.days; S.msg = { k: 'warn', html: h(T('err.moveTaken')) }; render(); return; }
      if (j.error === 'cancelled' || j.error === 'past') { S.mgView = 'info'; loadManage(); return; }
      S.msg = { k: 'err', html: withPhone('err.move') }; render();
    });
  }

  /* ── דיאלוג אישור (ביטול) ── */
  function openDlg(title, text, actions) {
    var d = $('dlg'); $('dlgT').textContent = title; $('dlgP').textContent = text; $('dlgA').innerHTML = actions;
    if (d.showModal) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } } else d.setAttribute('open', '');
  }
  function closeDlg() { var d = $('dlg'); if (d.open) { try { d.close(); } catch (e) { d.removeAttribute('open'); } } }

  /* ═══════════════ אירועים ═══════════════ */
  function go(step) { S.step = step; S.msg = null; render('ph'); toTop(); }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (a === 'type') { var ch = S.type !== v; S.type = v; track('booking_type', { booking_type: v }); if (ch) { S.day = null; S.slot = null; S.days = null; } S.step = 2; S.msg = null; if (!S.days) loadSlots(); render('ph'); toTop(); }
    else if (a === 'to1') go(1);
    else if (a === 'to2') { readForm(); go(2); }
    else if (a === 'to3') { if (S.slot) go(3); }
    else if (a === 'day') { S.day = v; S.slot = null; render(); var x = document.querySelector('.day[aria-checked="true"]'); if (x) x.focus(); }
    else if (a === 'slot') { S.slot = v; track('booking_slot', { booking_type: S.type || (S.mg && S.mg.booking.type), booking_date: S.day, booking_time: v }); render(); var y = document.querySelector('.slot[aria-checked="true"]'); if (y) y.focus(); }
    else if (a === 'intent') { readForm(); S.intent = v; delete S.errs.intent; render(); var qi = document.querySelector('[data-act="intent"][aria-checked="true"]'); if (qi) qi.focus(); }
    else if (a === 'copy') {
      var done = function () { var l = $('cpL'); if (l) { l.textContent = T('done.copied'); setTimeout(function () { if ($('cpL')) $('cpL').textContent = T('done.copy'); }, 1800); } };
      var fb = function () { var c = $('cpF'); if (c) { c.style.display = 'block'; c.innerHTML = '<input class="cpbox" readonly aria-label="הקישור לשינוי או ביטול" value="' + h(v) + '">'; var i2 = c.querySelector('input'); i2.focus(); i2.select(); } };
      try { navigator.clipboard.writeText(v).then(done, fb); } catch (e) { fb(); }
    }
    else if (a === 'mgmove') { S.mgView = 'move'; S.day = null; S.slot = null; S.msg = null; render('ph'); }
    else if (a === 'mginfo') { S.mgView = 'info'; S.msg = null; render('ph'); }
    else if (a === 'askcancel') {
      var sh = S.mg.booking.type === 'showroom';
      openDlg(T(sh ? 'dlg.title.showroom' : 'dlg.title.consult'), dLong(S.mg.booking.date) + ' · ' + S.mg.booking.time + '. ' + T('dlg.text'),
        '<button type="button" class="btnd solid" data-act="docancel">' + h(T('dlg.yes')) + '</button><button type="button" class="btn2" data-act="nocancel">' + h(T('dlg.no')) + '</button>');
    }
    else if (a === 'nocancel') closeDlg();
    else if (a === 'docancel') { b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span> ' + h(T('dlg.busy')); doCancel(); }
    else if (a === 'domove') doMove();
  });
  document.addEventListener('click', function (ev) { var cm = $('calm'); if (cm && cm.open && !ev.target.closest('#calm')) cm.open = false; });
  document.addEventListener('submit', function (ev) { if (ev.target.id === 'frm') { ev.preventDefault(); if (!S.busy) submit(); } });
  document.addEventListener('input', function (ev) { var n = ev.target.name; if (n && S.errs[n]) { delete S.errs[n]; var l = ev.target.closest('.f'); if (l) l.classList.remove('bad'); var e = $('e_' + n); if (e) e.remove(); } });
  /* חיצים בתוך קבוצת radio (סוג / יום / שעה / תכנון) */
  document.addEventListener('keydown', function (ev) {
    var t = ev.target; if (!t.getAttribute || t.getAttribute('role') !== 'radio') return;
    var k = ev.key; if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].indexOf(k) < 0) return;
    var g = t.closest('[role="radiogroup"]'); if (!g) return;
    var items = Array.prototype.slice.call(g.querySelectorAll('[role="radio"]')); var i = items.indexOf(t);
    var nx = k === 'Home' ? 0 : k === 'End' ? items.length - 1 : (k === 'ArrowLeft' || k === 'ArrowDown') ? i + 1 : i - 1;
    if (nx < 0) nx = items.length - 1; if (nx >= items.length) nx = 0;
    ev.preventDefault(); items[nx].focus();
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { var cm = $('calm'); if (cm && cm.open) cm.open = false; } });

  /* v2.4 — טקסטים שמחוץ ל-#main: כותרת עליונה, תחתית, כותרת הלשונית ומטא (לגוגל; לשיתוף — book_publish_meta) */
  function setMeta(sel, v) { var m = document.querySelector(sel); if (m) m.setAttribute('content', v); }
  function applyStatic() {
    var tb = $('topBack'); if (tb) tb.textContent = T('top.back');
    var fp = $('ftP'); if (fp) fp.textContent = T('foot.privacy');
    document.title = (PV ? '[תצוגה מקדימה] ' : '') + T('meta.title');
    setMeta('meta[name="description"]', T('meta.description'));
    setMeta('meta[property="og:title"]', T('meta.og.title'));
    setMeta('meta[property="og:description"]', T('meta.og.description'));
  }

  /* v2.4 — תצוגה מקדימה: המערכת פותחת book…/?preview=1 ושולחת את הטקסטים שעל המסך (גם לפני שמירה).
     מתקבלות רק הודעות מהחלון שפתח את הדף וממקור מורשה; התוכן עובר h() כמו כל טקסט. אין קביעה/ביטול/שינוי אמיתיים. */
  var PV_ORIGINS = ['https://app.ironfitness.co.il', 'https://iron-smart.github.io'];
  var PV_SCREENS = [['1', 'סוג'], ['2', 'מועד'], ['3', 'פרטים'], ['done', 'אישור'], ['manage', 'ניהול'], ['cancelled', 'בוטלה'], ['empty', 'אין מועדים']];
  function pvSample() {
    var d = (S.days || []).filter(function (x) { return x.slots && x.slots.length; })[0];
    var t = S.type || 'showroom';
    return { type: t, date: d ? d.date : new Date(Date.now() + 864e5).toISOString().slice(0, 10), time: d ? d.slots[0] : '10:00' };
  }
  function pvDone() {
    var p = pvSample(), t = S.type || p.type;
    if (!S.f.name) S.f.name = 'ישראל ישראלי';
    S.done = { type: t, date: S.day || p.date, time: S.slot || p.time, end: addMin(S.slot || p.time, dur(t)), address: addr(), token: new Array(65).join('0') };
    render('ph');
  }
  function pvGo(v) {
    S.mode = 'book'; S.done = null; S.mg = null; S.msg = null; S.mgView = 'info'; S.pvEmpty = v === 'empty';
    if (v === '1' || v === '2' || v === '3' || v === 'empty') {
      S.step = v === 'empty' ? 2 : +v; if (S.step > 1 && !S.type) S.type = 'showroom';
      if (S.step === 3 && !S.slot) { var p = pvSample(); S.day = p.date; S.slot = p.time; }
      if (S.step === 2 && !S.days) loadSlots();
    } else if (v === 'done') { if (!S.type) S.type = 'showroom'; pvDone(); }
    else {
      var q = pvSample(); S.mode = 'manage';
      S.mg = { booking: { type: S.type || q.type, date: q.date, time: q.time, end: addMin(q.time, dur(S.type || q.type)), status: v === 'cancelled' ? 'cancelled' : 'active', address: addr() }, days: S.days || [] };
    }
    S.pvAt = v; pvBar(); render('ph');
  }
  function pvBar() {
    var bar = $('pvbar'); if (!bar) return;
    bar.hidden = false; document.body.classList.add('pv');
    bar.innerHTML = '<b>תצוגה מקדימה</b><span style="opacity:.8">הטקסטים מהמערכת, לפני שמירה · לא נקבעות פגישות</span><span style="flex:1"></span>' +
      PV_SCREENS.map(function (x) { return '<button type="button" data-pv="' + x[0] + '" aria-pressed="' + (S.pvAt === x[0]) + '">' + x[1] + '</button>'; }).join('');
  }
  if (PV) {
    window.addEventListener('message', function (ev) {
      if (PV_ORIGINS.indexOf(ev.origin) < 0 || !window.opener || ev.source !== window.opener) return;
      var d = ev.data; if (!d || d.type !== 'iron-book-preview' || !d.texts || typeof d.texts !== 'object') return;
      var tx = {}; Object.keys(d.texts).slice(0, 300).forEach(function (k) { if (/^[a-z0-9.]{1,40}$/i.test(k) && typeof d.texts[k] === 'string') tx[k] = d.texts[k].slice(0, 400); });
      S.cfg = S.cfg || cfgOf({}); S.cfg.texts = tx;
      var ms = +d.max_slots; if (ms >= 1 && ms <= 40) S.cfg.max_slots = ms;
      var cs = +d.consult_step; if (cs >= 5 && cs <= 120) S.cfg.consult_step = cs;
      render();
    });
    document.addEventListener('click', function (ev) { var b = ev.target.closest('[data-pv]'); if (b) pvGo(b.getAttribute('data-pv')); });
  }
  /* "מוכן" נשלח רק אחרי שה-config נטען — אחרת טעינת ה-config הייתה דורסת טקסטים שכבר הגיעו מהמערכת */
  function pvReady() { PV_ORIGINS.forEach(function (o) { try { if (window.opener) window.opener.postMessage({ type: 'iron-book-preview-ready' }, o); } catch (e) { /* מקור אחר */ } }); }

  /* ═══════════════ התחלה ═══════════════ */
  function cfgOf(j) {
    return { enabled: j.enabled !== false, consult_min: j.consult_min || 15, showroom_min: j.showroom_min || 30, horizon_days: j.horizon_days || 10, address: j.address || '',
      texts: (j.texts && typeof j.texts === 'object') ? j.texts : {}, max_slots: j.max_slots || 4, consult_step: j.consult_step || 30 };
  }
  if (S.mode === 'manage') {
    render();
    api({ action: 'config' }).then(function (j) { if (j.ok) { S.cfg = cfgOf(j); render(); } });
    loadManage();
  }
  else {
    render();
    api({ action: 'config' }).then(function (j) {
      if (!j.ok) { S.degraded = true; render(); if (PV) pvReady(); return; }
      S.cfg = cfgOf(j);
      track('booking_view', { booking_enabled: S.cfg.enabled, booking_type: S.type || undefined });
      if (S.cfg.enabled && S.type) { S.step = 2; loadSlots(); } else render();
      if (PV) { S.pvAt = '1'; pvBar(); pvReady(); }
    });
  }
})();
</script>
</body>
